name: lib389 Unit Tests

on:
  push:
    branches:
      - main
      - "389-ds-base-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: quay.io/389ds/ci-images:test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run lib389 unit tests
        working-directory: src/lib389
        env:
          PYTHONPATH: ${{ github.workspace }}/src/lib389
        run: python3 -m pytest -c pytest-unit.ini --junitxml=../../lib389-unit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lib389-unit-results
          path: lib389-unit.xml
